# The webui gates POST /livekit/token on the operator token whenever
# SKCHAT_GUEST_OPERATOR_TOKEN is set, so loopback alone is not enough and the
# agent 401 crash-looped before ever joining. Same value the webui uses.
# The token is NOT committed and NOT inline here: provision
# %h/.config/skchat/lumina-call.env (mode 0600) with
#   SKCHAT_GUEST_OPERATOR_TOKEN=<same value as webui-lumina.env>
# Optional (-) per the repo convention: a missing file degrades (401 on
# /livekit/token) rather than refusing to start.
[Service]
EnvironmentFile=-%h/.config/skchat/lumina-call.env
