# Engine-backed calls (skchat #133).
#
# OFF, the answerer joins the right room and publishes SILENCE by design, which
# is why Lumina was in the call but mute: the process that could converse
# (lumina-call.py) sat in a different, fixed room.
# ON, the answered room is handed to skchat.transports.livekit.build_room_session,
# so the VoiceEngine brain runs in the room the signed invite actually named.
#
# Falls back to the silence loop if the engine or the RTC extras are missing, so
# a call still connects and holds. Losing the voice is bad; losing the call is worse.
# Revert: delete this drop-in, daemon-reload, restart.
[Service]
Environment=SKCHAT_ANSWERER_ENGINE=1
