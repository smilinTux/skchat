# VAD tuned for Chef's mic (matches the values in
# skchat-lumina-call.service.d/{vad,fixes}.conf).
#
# 100/80 was a temporary diagnostic on 2026-08-13 to test whether Chef's quiet
# audio was speech. It was not: peak_rms stayed at 0 even at gate 100, proving
# the browser publishes a SILENT track. Restored, because the gate was never
# the problem and a too-low gate makes her trigger on room noise.
[Service]
Environment=LUMINA_VAD_RMS=400
Environment=LUMINA_STT_MIN_RMS=350
