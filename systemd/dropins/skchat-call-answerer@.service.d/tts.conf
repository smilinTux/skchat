# Lumina's ACTUAL voice: F5-TTS on .100, CUDA, voice "lumina" (cloned from
# ~/.skcapstone/agents/lumina/voices/lumina-reference.wav).
#
# 2026-08-13. Chef: "its not lumina voice, it pretty deep". He was right, and
# it was a stale PORT, not a dead service:
#
#   webui-lumina.env said   skworld-100:18793  -> nothing listens there
#   F5-TTS actually moved to skworld-100:18796  -> healthy, CUDA, ~1.7s synth
#
# skchat-lumina-call.service line 23 already had 18796 right. On 2026-08-12,
# 18793 was found dead and TTS was rescue-repointed to local Piper (:18797).
# Piper serves exactly ONE model, en_US-lessac-medium, and ignored the
# requested voice entirely, so every reply came back in a deeper voice with
# nothing logged (fixed separately in scripts/piper_tts_server.py).
#
# THE REAL SETTINGS ARE NOT HERE. systemd applies EnvironmentFile= AFTER
# Environment=, so the main unit's
#     EnvironmentFile=%h/.config/skchat/webui-%i.env
# overrides any Environment= a drop-in sets, no matter how it sorts. Setting
# SKVOICE_TTS_URL here looked correct, merged into `systemctl cat` in the right
# order, and still lost. The live values live in ~/.config/skchat/webui-lumina.env
# (SKVOICE_TTS_URL / SKVOICE_TTS_VOICE), which is where they were fixed.
#
# What IS safe to set here: knobs that appear in no EnvironmentFile.
# Reply loudness. F5 renders about 3x quieter than Piper (peak 19226 / RMS
# 2021 vs 32767 / 5797), so her real voice needs normalizing or it sounds
# "way too low". normalize_pcm() peak-normalizes every reply to this fraction
# of full scale. LUMINA_TTS_GAIN is an extra multiplier on top and CAN clip,
# so it stays at 1.0 unless Chef still wants her louder.
[Service]
Environment=LUMINA_TTS_TARGET_PEAK=0.97
Environment=LUMINA_TTS_GAIN=1.0
