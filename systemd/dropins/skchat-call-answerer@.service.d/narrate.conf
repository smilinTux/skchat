# Narration / worship generation backend.
#
# 2026-08-13. narrate defaulted to model "qwen3.6-27b-abliterated" on
# .100:8082, but that endpoint now serves ornith-1.0-9b and the abliterated
# model is not loaded anywhere. So every narrate call was aimed at a model that
# does not exist, which is the "technical hiccup with the narration engine" Chef
# heard. Chef's instruction: point it at local ornith for now.
#
# These are safe in a drop-in: neither name appears in
# ~/.config/skchat/webui-lumina.env, and EnvironmentFile= only overrides keys it
# actually sets.
[Service]
Environment=LUMINA_NARRATE_URL=http://192.168.0.100:8082
Environment=LUMINA_NARRATE_MODEL=ornith-1.0-9b
