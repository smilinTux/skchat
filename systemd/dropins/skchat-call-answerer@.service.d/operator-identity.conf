# Who counts as "Chef" for addressing + the agent-turn cap.
#
# 2026-08-13. Chef's browser authenticates as the AGENT, not as the operator,
# so his LiveKit participant identity is "lumina@chef.skworld.io". The default
# prefix list is ("chef",) and is_chef_identity() is a startswith() match, so
# that identity did NOT match: it starts with "lumina".
#
# Two things broke because of it, both of which look like "she stopped
# answering me":
#   1. should_reply() only resets _agent_turn_streak when the speaker is chef,
#      and increments it when they are not. So every sentence Chef spoke was
#      counted as an AGENT turn, and after LUMINA_AGENT_TURN_CAP (6) she went
#      permanently quiet: "agent-turn cap (6) hit - quiet until a human speaks".
#   2. is_addressed()'s sacred-mode branch ("in a 1:1, always listen to Chef")
#      never fired, so she only replied when he happened to say her name.
#
# call_answerer._conversational_peer() already works this out and logs
# "self-addressed call; treating the caller as the operator", but it only feeds
# the MODE choice; the per-utterance Addressing check never learns it.
#
# This teaches the prefix list that identity directly. The real fix is for the
# browser to hold chef's own identity (see the webui warning "the browser
# should hold chef's identity"); until then this is the honest mapping, and it
# is exactly what the operator-gated call routes already assume.
[Service]
Environment=LUMINA_OPERATOR_PREFIXES=chef,lumina@chef
