name: Publish to PyPI

# Two entry points, one workflow:
#
#   push to main  -> cut the next vX.Y.Z tag, then build + publish it
#   push of a v*  -> build + publish that tag (manual or historical releases)
#
# The tagging lives INSIDE this workflow on purpose, for two reasons that are
# easy to get wrong:
#
#   1. PyPI Trusted Publishing is bound to the workflow FILENAME
#      (owner=smilinTux workflow=publish.yml environment=pypi). Publishing from
#      any other workflow file fails OIDC, so the publish step cannot move.
#   2. A tag pushed with GITHUB_TOKEN does NOT trigger other workflows (GitHub's
#      recursive-run prevention). So a separate "tag main" workflow would create
#      the tag and nothing would ever publish it. Keeping both in one run
#      sidesteps that entirely, and also means the tag push cannot double-fire
#      this workflow.
#
# Card 0c3668a6. Previously the ONLY thing that cut tags was a local pre-push
# git hook, which fired on ANY branch push, so 5 of 6 consecutive tags were cut
# off unmerged feature branches and one shipped to PyPI straight from an
# in-review branch. That hook has now been REMOVED outright (2026-08-13) rather
# than just constrained to main: even main-only, it still turned an ordinary
# push into a release, and 12 of the 14 fleet repos never had it and release
# fine without one.
#
# Releases are therefore explicit: `git tag vX.Y.Z && git push origin vX.Y.Z`,
# or a manual workflow_dispatch. Nothing cuts a tag on your behalf. The
# "refuse to publish a tag that is not on main" step in `build` stays as the
# server-side backstop, since a tag can still arrive from any clone.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Never let two releases race: a second push to main waits rather than
  # computing the same "next" tag from a stale view of the tag list.
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------- #
  # Cut the release tag. Only on a push to main; skipped on a tag push.
  # ---------------------------------------------------------------------- #
  tag:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tagged: ${{ steps.bump.outputs.tagged }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history + tags, or `git describe` cannot see the latest tag and
          # every run would compute v0.0.1.
          fetch-depth: 0
          fetch-tags: true
      - id: bump
        name: Cut the next patch tag if HEAD is not already tagged
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Use the HIGHEST v-tag in the repo, not `git describe`.
          #
          # describe only sees tags that are ANCESTORS of HEAD. In skcoord and
          # skdashboard the only release tag had never been pushed to the
          # remote, so CI legitimately found "previous: none", cut v0.0.1, and
          # published a version BELOW the existing 0.1.0. A release must never
          # be able to go backwards, so rank all tags by version instead and
          # ignore reachability.
          latest="$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' | sort -V | tail -1)"
          head_sha="$(git rev-parse HEAD)"

          # Any release tag AT HEAD means there is nothing new to ship, even if
          # it is not the highest one (the highest may live on another line of
          # history now that we rank rather than walk ancestry).
          if [ -n "$(git tag --points-at HEAD -l 'v[0-9]*.[0-9]*.[0-9]*')" ]; then
            echo "HEAD is already tagged $(git tag --points-at HEAD -l 'v[0-9]*' | tr '\n' ' '); nothing to release."
            echo "tagged=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          base="${latest:-v0.0.0}"
          ver="${base#v}"
          IFS='.' read -r major minor patch <<< "$ver"
          major="${major:-0}"; minor="${minor:-0}"; patch="${patch:-0}"
          next="v${major}.${minor}.$((patch + 1))"
          while git rev-parse -q --verify "refs/tags/$next" >/dev/null 2>&1; do
            patch=$((patch + 1))
            next="v${major}.${minor}.$((patch + 1))"
          done

          echo "Cutting $next at ${head_sha:0:8} (previous: ${latest:-none})"
          git tag -a "$next" -m "release: $next from main"
          git push origin "$next"
          echo "tagged=true" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------- #
  # Build. Runs for a tag push (tag job skipped) and for a main push that
  # actually cut a tag. Skipped when main had nothing new to release.
  # ---------------------------------------------------------------------- #
  build:
    needs: [tag]
    # `always()` is required because `needs` on a SKIPPED job would otherwise
    # skip this one on the tag-push path.
    if: >-
      always() && !cancelled() &&
      (needs.tag.result == 'skipped' || needs.tag.outputs.tagged == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # setuptools-scm derives the version from the tag, so the tag the job
          # above just pushed must be visible here or the build would produce a
          # dev version with a local segment (+g<sha>), which PyPI rejects.
          fetch-depth: 0
          fetch-tags: true
      - name: Refuse to publish a tag that is not on main
        # Card 0c3668a6, final criterion. The tag job above can only cut tags on
        # main, but a tag can still ARRIVE from elsewhere: the local pre-push
        # hook is a symlink into each clone's working tree, so any clone that has
        # not yet pulled the main-only fix keeps cutting tags at feature-branch
        # tips and pushing them. That is not hypothetical: v0.14.219 was cut at a
        # feature-branch commit by a stale clone and published successfully.
        #
        # So this is the last line of defence, and it is server-side: it holds no
        # matter what any developer's clone does.
        #
        # Override with ALLOW_OFF_MAIN_RELEASE=1 as a repository variable if a
        # release ever legitimately needs to come off a maintenance branch.
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          if [ "${{ vars.ALLOW_OFF_MAIN_RELEASE }}" = "1" ]; then
            echo "ALLOW_OFF_MAIN_RELEASE=1 is set; skipping the on-main check."
            exit 0
          fi
          git fetch --no-tags origin main:refs/remotes/origin/main
          if git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main; then
            echo "OK: ${GITHUB_REF_NAME} (${GITHUB_SHA:0:8}) is on main."
            exit 0
          fi
          echo "::error::${GITHUB_REF_NAME} points at ${GITHUB_SHA:0:8}, which is NOT on main. Refusing to publish."
          echo "::error::A tag cut off a feature branch must not become a release. Delete the tag, merge to main, and let the main push cut the release."
          exit 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade build twine
      - name: Assert the derived version is a real release, not a dev build
        # Fail loud rather than uploading a 0.0.0+unknown or a .devN+g<sha>.
        run: |
          python -m pip install --upgrade setuptools_scm
          v="$(python -m setuptools_scm 2>/dev/null || echo unknown)"
          echo "setuptools-scm derives: $v"
          case "$v" in
            *+*|*dev*|unknown|0.0.0*)
              echo "::error::refusing to publish a non-release version: $v"
              exit 1 ;;
          esac
      - run: python -m build
      - run: python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  pypi-publish:
    needs: [build, tag]
    # `always()` is required for the same reason `build` above needs it. A skip
    # propagates all the way DOWN a needs chain, not just one level: this job
    # needs `build`, which needs `tag`, and on the tag-push path `tag` is
    # skipped. Without an opt-out this job inherited that skip and completed
    # with ZERO steps while the run still reported success. That is how PyPI
    # stalled at 0.14.227 while tags marched on past v0.14.233: `build` really
    # did build and upload a correctly versioned dist, and nothing published it.
    #
    # Publish on EITHER path, which matters more than it looks:
    #
    #   * refs/tags/v*        a tag pushed by a human (the local pre-push hook
    #                         uses their credentials, so it triggers a run).
    #   * main + tagged==true the `tag` job just cut the tag itself. That tag is
    #                         pushed with GITHUB_TOKEN, and GitHub deliberately
    #                         does NOT trigger workflow runs from GITHUB_TOKEN
    #                         pushes, so NO tag-push run will ever follow it.
    #
    # Gating on the tag ref alone therefore makes the automated path unable to
    # publish at all: it waits for a run that cannot exist. The main-path run
    # has the right artifact anyway, because `tag` pushes the tag before `build`
    # runs, so setuptools-scm derives the real release version (the "Assert the
    # derived version is a real release" step in `build` proves it).
    if: >-
      always() && !cancelled() && needs.build.result == 'success' &&
      (startsWith(github.ref, 'refs/tags/v') || needs.tag.outputs.tagged == 'true')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # Both paths above can fire for one version if someone pushes a tag
          # by hand that the workflow would also have cut. Re-uploading an
          # existing file is a hard 400 from PyPI, which would turn a duplicate
          # into a red release. The upload is idempotent instead.
          skip-existing: true
