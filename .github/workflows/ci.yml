name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Pinned: an unpinned ruff lets a new release re-drift the format/lint
      # rules and turn main red with zero code changes (the "chronically red"
      # cause). Bump deliberately.
      - run: pip install ruff==0.15.4
      - run: ruff check src/ tests/
      - run: ruff format --check src/ tests/

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      # Published sibling wheels lag their repos (see pytest.yml for the detail);
      # install from source so CI tests the code that ships together.
      - run: |
          pip install --force-reinstall --no-deps --no-cache-dir \
            "capauth @ git+https://github.com/smilinTux/capauth@main" \
            "skcomms @ git+https://github.com/smilinTux/skcomms@main"
      - run: python -m pytest tests/ -v --tb=short --cov=src --cov-report=term-missing -m "not live and not integration and not e2e_live and not e2e_3way"
