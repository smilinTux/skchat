[build-system]
requires = ["setuptools>=68.0", "wheel", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "skchat-sovereign"
dynamic = ["version"]
description = "AI-native encrypted P2P chat — sovereign communication for humans and AI"
readme = "README.md"
license = {text = "GPL-3.0-or-later"}
requires-python = ">=3.11"
authors = [
    {name = "smilinTux", email = "admin@smilintux.org"},
]
keywords = ["chat", "p2p", "pgp", "encrypted", "ai", "sovereign"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Communications :: Chat",
    "Topic :: Security :: Cryptography",
]
dependencies = [
    "pydantic>=2.0",
    "PGPy>=0.6",
    "pyyaml>=6.0",
    "Pillow>=10.0",
    "filetype>=1.2",
    # HTTP daemon surface (daemon_proxy, call/conf routes, webui) — imported at
    # module load by 16 modules; was undeclared, so CI's clean install failed to
    # collect ~36 test modules with ModuleNotFoundError: fastapi.
    # Upper-pinned: fastapi 0.136+ wraps included routers in `_IncludedRouter`
    # objects that lack `.path`, breaking route-introspection tests. The deployed
    # daemon runs 0.135.x (flat routes with `.path`), so cap below 0.136 to
    # match production and keep the route-registration tests meaningful.
    "fastapi>=0.110,<0.136",
    "uvicorn>=0.29",
    # PyJWT + cryptography back the HS256 operator/guest/embed token machinery
    # (guest.py, guest_groups.py, embed_auth.py, and now capauth.pairing.
    # operator_session, coord 3731ae06). Same story as fastapi above: imported
    # at module/call load without ever being declared here.
    "PyJWT>=2.8",
    "cryptography>=41.0",
    # capauth.pairing.operator_session is now the mint/verify/device-standing
    # primitive skchat's operator session runs on (moved out of skchat's own
    # operator_auth.py, coord 3731ae06) -- a core runtime path (guest.py,
    # dataplane_auth.py, cli.py, webui.py, device_routes.py,
    # operator_auth_routes.py), not just a test/dev integration. Promoted out
    # of the dev-only extra below for that reason.
    #
    # Bounded, not floating. capauth carries AUTHORIZATION GATES, so a release
    # can change what is permitted without any skchat commit. That is not
    # hypothetical: capauth card N10 made `enroll_device(mode="verified")`
    # require a possession proof, and skchat's main went red for 37 hours
    # (last green 2026-08-14T22:57) with merges still landing into it, because
    # a floating `>=0.3.1` picked the new gate up on its own. Nobody broke it;
    # it broke itself when a dependency moved, and the blame landed on whoever
    # merged last.
    #
    # The ceiling makes the next such change a DELIBERATE act: capauth 0.4 will
    # not install until someone raises this bound and reads what changed. Raise
    # it in the same PR that adapts to the new behaviour, never on its own.
    "capauth>=0.3.2,<0.4",  # 0.3.2 ships pairing.enrollment_challenge (see operator_grants)
]

[project.optional-dependencies]
cli = [
    "click>=8.1",
    "rich>=13.0",
    # Renders the scannable QR for `skchat devices link`. Optional on purpose:
    # the command degrades to printing the code and URL when it is absent, so a
    # missing QR library can never stop an operator linking a device.
    "segno>=1.5",
]
skcapstone = [
    # Optional integration backbone (ADR-optional-integration-backbone).
    # skchat runs fully standalone without this; when present the integration
    # adapter routes alerts to sk-alert and registers jobs with skscheduler.
    "skcapstone>=0.1",
]
all = [
    "skchat-sovereign[cli]",
]
sk-pqc = [
    # coord 0a1f0a51: OPTIONAL re-export of the published sk_pqc lib. When present,
    # the ratchet modules (dm_ratchet/group_ratchet) re-export sk_pqc's vetted
    # code; when ABSENT (e.g. .41) they fall back to the local impl unchanged.
    # NOT a hard runtime dep — never required to run. Install: pip install
    # "skchat-sovereign[sk-pqc]"
    "sk-pqc>=0.1",
]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.0",
    "black>=24.0",
    "ruff>=0.4",
    "click>=8.1",
    "rich>=13.0",
    "mcp>=1.0",
    "httpx>=0.27",
    "textual>=0.50",
    "skcomms>=0.1.0",
    "skmemory>=0.9",
    # capauth is now a core runtime dependency (see [project.dependencies]
    # above, which carries the same bounded pin and the ceiling rationale); no
    # separate dev-extra entry needed.
    # the skcode ws-proxy tests dial a real websocket client; same story as
    # capauth above (published, just never declared).
    "websockets>=12.0",
    # WebRTC call/spaces surfaces imported at module load by 17 test files;
    # pip-installable (unlike the sibling SK* packages), so install in CI.
    "livekit>=1.0",
    "livekit-api>=1.0",
    # skcomms.pqkem hard-fails (by design, no classical downgrade) without the
    # oqs (liboqs-python) PQ-KEM backend, so ~186 DM/ratchet tests error in CI.
    # liboqs-python is pip-installable and auto-provisions liboqs on first import.
    "liboqs-python>=0.10",
]

[project.scripts]
skchat = "skchat.cli:main"
skchat-mcp = "skchat.mcp_server:main"
skchat-voice = "skchat.transports.serve_ws:main"

[project.urls]
Homepage = "https://skchat.io"
Repository = "https://github.com/smilinTux/skchat"
Issues = "https://github.com/smilinTux/skchat/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
skchat = ["SKILL.md", "static/*"]

# Belt and braces. The line above looks like it limits the wheel to the top level
# of static/, but it does not: `include-package-data` defaults to TRUE under
# pyproject.toml, and setuptools_scm's file finder reports every git-tracked file,
# so in practice ANYTHING committed under src/skchat/ is shipped.
#
# That is how src/skchat/static/app/pqc/node_modules (314 files, 34MB, including
# THREE copies of the same 10MB esbuild binary) ended up inside all 368 published
# releases, taking skchat-sovereign past PyPI's 10GB per-project limit and
# hard-blocking every publish with a 400.
#
# node_modules is now gitignored, which is the actual fix. This exclude is the
# second line of defence, so a `git add -f` cannot quietly put 30MB of Node build
# tooling back into a Python wheel.
[tool.setuptools.exclude-package-data]
skchat = ["static/app/pqc/node_modules/*", "static/app/pqc/node_modules/**/*"]

[tool.setuptools_scm]
version_file = "src/skchat/_version.py"
fallback_version = "0.0.0+unknown"

[tool.ruff]
line-length = 99
target-version = "py311"
# setuptools_scm GENERATES src/skchat/_version.py (see version_file above) during
# the editable install CI runs before linting, and it emits single-quoted strings
# that `ruff format --check` rejects. The file is gitignored, so nobody can fix it
# by committing a formatted copy: it is rewritten on every build and the check
# goes red again. That is a standing source of the "chronically red" CI this
# workflow's own comments complain about. Exclude the artifact instead.
extend-exclude = ["src/skchat/_version.py"]

[tool.ruff.lint]
select = ["E", "W", "F", "I"]
ignore = [
    "E501",   # line too long (handled by formatter)
    "F821",   # undefined name (false positives for lazy/local imports)
    "F841",   # local variable assigned but never used (intentional in tests)
    "E402",   # module level import not at top of file (needed in conftest)
]

[tool.black]
line-length = 99
target-version = ["py311"]

[tool.coverage.run]
branch = true
source = ["src"]
omit = [
    "tests/*",
    "*/tests/*",
    "src/skchat/static/*",
]

[tool.coverage.report]
# Measured branch coverage was ~57% on 2026-06-17; gate sits a few points
# below so CI passes today and can be ratcheted up as coverage improves.
fail_under = 54
show_missing = true
skip_covered = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "live: test hits live model endpoints (skworld-100/.100/localhost); run with -m live",
    "integration: mark test as an integration test requiring live external services",
    "e2e_live: end-to-end tests using file-based transport (no daemon or network required)",
    "e2e_3way: 3-way group chat E2E tests (Chef + Opus + Lumina in skworld-team)",
    "touches_real_home: opts out of the live-state guard; the test genuinely writes to the real ~/.skchat (there are none today)",
]
addopts = "-v --tb=short -m 'not live'"
asyncio_mode = "auto"
